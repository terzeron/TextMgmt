[package]
name = "es_client"
description = "Elasticsearch REST 클라이언트(검색·색인·저수준 전송)"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
common = { path = "../common", default-features = false }
http_client = { path = "../http_client" }
serde_json = { workspace = true, features = ["preserve_order"] }
ureq = { workspace = true, features = ["rustls"] }

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"

[[test]]
name = "es_client"
path = "../../tests/rust/es_client/es_client.rs"

[[test]]
name = "indexing"
path = "../../tests/rust/es_client/indexing.rs"

[[test]]
name = "integration_es"
path = "../../tests/rust/es_client/integration/es.rs"

[[test]]
name = "integration_indexing"
path = "../../tests/rust/es_client/integration/indexing.rs"
