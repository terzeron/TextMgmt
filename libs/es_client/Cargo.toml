[package]
name = "es_client"
description = "Elasticsearch REST 클라이언트 (backend/es_manager.py ESManager 중 검색 부분의 Rust 대응)"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "indexing"
path = "../../tests/rust/es_client/indexing.rs"

[[test]]
name = "es"
path = "../../tests/rust/es_client/es.rs"

[dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
ureq = { workspace = true, features = ["rustls"] }

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
