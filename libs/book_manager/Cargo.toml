[package]
name = "book_manager"
description = "책·만화 관리: 목록·검색·미리보기·편집·재적재·카테고리 제안(BookManager), 만화(comics_manager), 책 메타데이터, EPUB 메타데이터·PDF 쪽 읽기, 조회 이력, 백그라운드 작업 실행기"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
async-trait = "0.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
classifier = { path = "../classifier" }
common = { path = "../common" }
cover_manager = { path = "../cover_manager" }
doc_reader = { path = "../doc_reader" }
file_indexer = { path = "../file_indexer" }
htmlkit = { path = "../htmlkit" }
hwp3_parser = { path = "../hwp3_parser" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
jpeg-encoder = "0.7.1"
log = "0.4.34"
lopdf.workspace = true
regex = "1.13.1"
roxmltree = "0.21.1"
scraper = "0.29.0"
search_manager = { path = "../search_manager" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.11.1"
sysdeps = { path = "../sysdeps" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
xml_recoverer = { path = "../xml_recoverer" }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
db = { path = "../db" }
doc_reader = { path = "../doc_reader" }
es_client = { path = "../es_client" }
flate2 = "1"
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["mysql", "blocking"] }
tokio = { version = "1.54.1", features = ["time"] }

