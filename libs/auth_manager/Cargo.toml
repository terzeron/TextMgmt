[package]
name = "auth_manager"
description = "인증: JWT 발급·검증과 역할 판정(auth_service), refresh token 저장·회전·세션 관리(refresh_token_store). HTTP 요청은 http crate 타입으로만 받는다"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
base64 = "0.23.1"
db = { path = "../db" }
http = "1.5.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
log = "0.4.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sysdeps = { path = "../sysdeps" }

[dev-dependencies]
testcontainers-modules = { version = "0.15.0", features = ["mysql", "blocking"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "auth_service"
path = "../../tests/rust/auth_manager/auth_service.rs"

[[test]]
name = "integration_refresh_token_store"
path = "../../tests/rust/auth_manager/integration/refresh_token_store.rs"
