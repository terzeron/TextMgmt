[package]
name = "text_decoder"
description = "바이트를 텍스트로: 잘못된 바이트를 버리는 디코딩, 인코딩 코덱, 인코딩 추정 휴리스틱, 한글 판정"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
encoding_rs = "0.8.42"

[[test]]
name = "text_decoder"
path = "../../tests/rust/text_decoder/text_decoder.rs"

[[test]]
name = "text_transcoder"
path = "../../tests/rust/text_decoder/text_transcoder.rs"

[[test]]
name = "encoding_guesser"
path = "../../tests/rust/text_decoder/encoding_guesser.rs"
