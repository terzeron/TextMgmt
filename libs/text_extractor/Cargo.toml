[package]
name = "text_extractor"
description = "책 파일 본문 발췌, 인코딩 판별 휴리스틱, 한국어 판정"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
encoding_rs = "0.8.42"
regex = "1.13.1"
sysdeps = { path = "../sysdeps" }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[[test]]
name = "text_extractor"
path = "../../tests/rust/text_extractor/text_extractor.rs"
