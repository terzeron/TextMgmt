[package]
name = "file_record"
description = "파일 하나를 색인 레코드로 읽는다: 종류 판별, 본문·메타데이터 추출, 자식 프로세스 격리. loader와 backend가 함께 쓴다"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
text_extractor = { path = "../text_extractor" }
doc_reader = { path = "../doc_reader" }
isbn = { path = "../isbn" }
lopdf.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
stat = { path = "../stat" }
sysdeps = { path = "../sysdeps" }

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "file_time"
path = "../../tests/rust/file_record/file_time.rs"

[[test]]
name = "record_builder"
path = "../../tests/rust/file_record/record_builder.rs"

[[test]]
name = "ignore_rules"
path = "../../tests/rust/file_record/ignore_rules.rs"

[[test]]
name = "env_config"
path = "../../tests/rust/file_record/env_config.rs"
