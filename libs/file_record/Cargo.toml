[package]
name = "file_record"
description = "파일 하나를 색인 레코드로 읽는다: 종류 판별, 본문·메타데이터 추출, 자식 프로세스 격리. loader와 backend가 함께 쓴다"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "file_time"
path = "../../tests/rust/file_record/file_time.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
corpus_common = { path = "../corpus_common" }
doc_reader = { path = "../doc_reader" }
isbn = { path = "../isbn" }
lopdf.workspace = true
parser_timeout = { path = "../parser_timeout" }
serde_json = { workspace = true, features = ["preserve_order"] }
stat = { path = "../stat" }

[dev-dependencies]
tempfile = "3.27.0"
