[package]
name = "sysdeps"
description = "시계, 파일시스템, 외부 명령, HTTP 응답 같은 시스템 능력 trait와 실제 구현 (테스트에서 대역으로 바꿔 끼운다)"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "tm-pdf-worker"
path = "src/bin/pdf_worker.rs"

[dependencies]
async-trait = "0.1"
libc = "0.2"
serde_json.workspace = true
lopdf.workspace = true
mupdf = { version = "=0.8.0", default-features = false, features = ["base14-fonts", "system-fonts", "sys-lib-libjpeg", "sys-lib-zlib", "sys-lib-freetype", "sys-lib-harfbuzz", "sys-lib-openjpeg"] }

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "native_pdf"
path = "../../tests/rust/sysdeps/native_pdf.rs"

[[test]]
name = "sysdeps"
path = "../../tests/rust/sysdeps/sysdeps.rs"

[[test]]
name = "timeout_runner"
path = "../../tests/rust/sysdeps/timeout_runner.rs"

[[test]]
name = "pdf_worker_client"
path = "../../tests/rust/sysdeps/pdf_worker_client.rs"
