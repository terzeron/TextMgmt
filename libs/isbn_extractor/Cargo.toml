[package]
name = "isbn_extractor"
description = "파일에서 ISBN 찾기와 검증"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
doc_reader = { path = "../doc_reader" }
sysdeps = { path = "../sysdeps" }
regex = "1.13.1"
stat = { path = "../stat" }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[[test]]
name = "isbn_extractor"
path = "../../tests/rust/isbn_extractor/isbn_extractor.rs"
