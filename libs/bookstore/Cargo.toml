[package]
name = "bookstore"
description = "온라인 서점(Yes24·알라딘·교보문고) 검색과 상세 페이지 추출 (backend/bookstore.py의 Rust 대응)"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "extract"
path = "../../tests/rust/bookstore/extract.rs"

[[test]]
name = "search"
path = "../../tests/rust/bookstore/search.rs"

[dependencies]
htmlkit = { path = "../htmlkit" }
regex = "1.13.1"
scraper = "0.29.0"
# 공개 서점은 HTTPS라 이 crate에서만 TLS(rustls)를 켠다. 인증서 검증은 기본값(켬)을 그대로 쓴다.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
serde_json = { workspace = true }
