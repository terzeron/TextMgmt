[package]
name = "doc_checker"
description = "문서 파일 검사와 교정 기법: EPUB·PDF·TXT·HWP·RTF·ZIP 계열의 보안·결함·렌더링 차단 지표, 보안 정리와 결함 수리의 재구성·검증, TXT 재인코딩"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
doc_reader = { path = "../doc_reader" }
common = { path = "../common", default-features = false, features = ["xml_parser", "zip_reader"] }
encoding_rs = "0.8.42"
flate2 = "1"
htmlkit = { path = "../htmlkit" }
lopdf.workspace = true
regex = "1.13.1"
roxmltree = "0.21.1"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sysdeps = { path = "../sysdeps" }
text_decoder = { path = "../text_decoder" }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile = "3.27.0"

