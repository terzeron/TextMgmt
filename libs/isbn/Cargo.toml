[package]
name = "isbn"
description = "파일에서 ISBN 추출 (utils/isbn.py의 Rust 대응)"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "isbn"
path = "../../tests/rust/isbn/isbn.rs"

[dependencies]
corpus_common = { path = "../corpus_common" }
flate2 = "1"
htmlkit = { path = "../htmlkit" }
lopdf.workspace = true
parser_timeout = { path = "../parser_timeout" }
sysdeps = { path = "../sysdeps" }
regex = "1.13.1"
stat = { path = "../stat" }
unicode-general-category = "1.1.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
