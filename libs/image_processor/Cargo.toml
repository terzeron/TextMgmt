[package]
name = "image_processor"
description = "이미지 공용 처리: 회전 크롭 기하(image_cropper), 검증한 IP로만 연결하는 URL 이미지 받기(image_fetcher), 이미지 크기·픽셀 상한. 표지와 PDF 쪽 편집이 함께 쓴다"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
common = { path = "../common", default-features = false, features = ["http_client"] }
idna = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
ureq = { workspace = true, features = ["rustls"] }

[dev-dependencies]

[[test]]
name = "image_fetcher"
path = "../../tests/rust/image_processor/image_fetcher.rs"

[[test]]
name = "integration_image_fetcher"
path = "../../tests/rust/image_processor/integration/image_fetcher.rs"
