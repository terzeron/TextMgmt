[package]
name = "doc_reader"
description = "문서 본문 요약 추출: TXT·EPUB·HTML·RTF·DOCX·PDF (utils/loader.py의 read_from_* 대응)"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
text_extractor = { path = "../text_extractor" }
ego-tree = "0.11"
encoding_rs = "0.8.42"
flate2 = "1"
hwp3_parser = { path = "../hwp3_parser" }
lopdf.workspace = true
pyfmt = { path = "../pyfmt" }
regex = "1.13.1"
roxmltree = "0.21"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
scraper = "0.29.0"
sysdeps = { path = "../sysdeps" }
serde_json = { workspace = true }
tempfile = "3.27.0"

[[test]]
name = "epub"
path = "../../tests/rust/doc_reader/epub.rs"

[[test]]
name = "markup"
path = "../../tests/rust/doc_reader/markup.rs"

[[test]]
name = "office"
path = "../../tests/rust/doc_reader/office.rs"

[[test]]
name = "pdf"
path = "../../tests/rust/doc_reader/pdf.rs"

[[test]]
name = "rtf"
path = "../../tests/rust/doc_reader/rtf.rs"

[[test]]
name = "text"
path = "../../tests/rust/doc_reader/text.rs"

[[test]]
name = "py_str_compat"
path = "../../tests/rust/doc_reader/py_str_compat.rs"

[[test]]
name = "mojibake_counter"
path = "../../tests/rust/doc_reader/mojibake_counter.rs"
