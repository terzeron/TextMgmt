[package]
name = "doc_reader"
description = "문서 본문 요약 추출: TXT·EPUB·HTML·RTF·DOCX·PDF·HWP, 파일 앞뒤 읽기"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
log = "0.4.34"
xml_recoverer = { path = "../xml_recoverer" }
common = { path = "../common", default-features = false, features = ["xml_parser", "zip_reader"] }
text_decoder = { path = "../text_decoder" }
ego-tree = "0.11"
encoding_rs = "0.8.42"
flate2 = "1"
hwp3_parser = { path = "../hwp3_parser" }
htmlkit = { path = "../htmlkit" }
lopdf.workspace = true
regex = "1.13.1"
roxmltree = "0.21"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
scraper = "0.29.0"
sysdeps = { path = "../sysdeps" }
serde_json = { workspace = true }
tempfile = "3.27.0"


[dev-dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[[test]]
name = "head_tail_reader"
path = "../../tests/rust/doc_reader/head_tail_reader.rs"

[[test]]
name = "epub"
path = "../../tests/rust/doc_reader/epub.rs"

[[test]]
name = "markup"
path = "../../tests/rust/doc_reader/markup.rs"

[[test]]
name = "office"
path = "../../tests/rust/doc_reader/office.rs"

[[test]]
name = "pdf"
path = "../../tests/rust/doc_reader/pdf.rs"

[[test]]
name = "rtf"
path = "../../tests/rust/doc_reader/rtf.rs"

[[test]]
name = "text"
path = "../../tests/rust/doc_reader/text.rs"

[[test]]
name = "text_normalizer"
path = "../../tests/rust/doc_reader/text_normalizer.rs"

[[test]]
name = "text_sampler"
path = "../../tests/rust/doc_reader/text_sampler.rs"

[[test]]
name = "epub_metadata_reader"
path = "../../tests/rust/doc_reader/epub_metadata_reader.rs"

[[test]]
name = "pdf_page_reader"
path = "../../tests/rust/doc_reader/pdf_page_reader.rs"
