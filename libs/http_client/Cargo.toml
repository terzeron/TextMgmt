[package]
name = "http_client"
description = "HTTP 요청과 응답: 테스트에서 바꿔 끼우는 HttpSession, ureq agent 설정, 본문 idle timeout과 응답 크기 상한"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
serde_json.workspace = true
# 공개 서점과 ES는 HTTPS라 TLS(rustls)를 켠다. 인증서 검증은 기본값(켬)을 그대로 쓴다.
ureq = { workspace = true, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "http_client"
path = "../../tests/rust/http_client/http_client.rs"

[[test]]
name = "integration_http_client"
path = "../../tests/rust/http_client/integration/http_client.rs"
