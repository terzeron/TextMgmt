[package]
name = "classifier"
description = "도서 분류기: 모델 학습·추론, 코퍼스, 서점 정책. backend와 분류 도구가 함께 쓴다"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
bookstore = { path = "../bookstore" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
text_extractor = { path = "../text_extractor" }
db = { path = "../db" }
es_client = { path = "../es_client" }
fancy-regex = "0.14.0"
log = "0.4.34"
pyfmt = { path = "../pyfmt" }
regex = "1.13.1"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.11.1"
sysdeps = { path = "../sysdeps" }

[dev-dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[[test]]
name = "classifier"
path = "../../tests/rust/classifier/classifier.rs"

[[test]]
name = "classifier_calibration"
path = "../../tests/rust/classifier/classifier_calibration.rs"

[[test]]
name = "classifier_corpus"
path = "../../tests/rust/classifier/classifier_corpus.rs"

[[test]]
name = "classifier_gaps"
path = "../../tests/rust/classifier/classifier_gaps.rs"

[[test]]
name = "classifier_model"
path = "../../tests/rust/classifier/classifier_model.rs"

[[test]]
name = "classifier_parity"
path = "../../tests/rust/classifier/classifier_parity.rs"

[[test]]
name = "classifier_reader"
path = "../../tests/rust/classifier/classifier_reader.rs"

[[test]]
name = "classifier_service"
path = "../../tests/rust/classifier/classifier_service.rs"

[[test]]
name = "classifier_training"
path = "../../tests/rust/classifier/classifier_training.rs"

[[test]]
name = "book_classifier"
path = "../../tests/rust/classifier/book_classifier.rs"

[[test]]
name = "book_classifier_parity"
path = "../../tests/rust/classifier/book_classifier_parity.rs"

[[test]]
name = "bookstore_cache"
path = "../../tests/rust/classifier/bookstore_cache.rs"

[[test]]
