[package]
name = "corpus_common"
description = "코퍼스 도구 공용 코드: 본문 읽기, 인코딩 판별, 경로 도구, 병렬 풀"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "common_fns"
path = "../../tests/rust/corpus_common/common_fns.rs"

[[test]]
name = "reader"
path = "../../tests/rust/corpus_common/reader.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8.42"
pyfmt = { path = "../pyfmt" }
regex = "1.13.1"
scan_common = { path = "../scan_common" }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
