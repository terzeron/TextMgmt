[package]
name = "book_record"
description = "책 한 권의 기록: 메타데이터 모델(`Book`), ES 문서 변환, 파일시스템 상태와 무관한 경로·파일 종류 규칙"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
common = { path = "../common", default-features = false, features = ["zip_reader"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sysdeps = { path = "../sysdeps" }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]

[[test]]
name = "book_metadata"
path = "../../tests/rust/book_record/book_metadata.rs"
