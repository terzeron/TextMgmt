---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: es-backend-tls
  namespace: textmanager
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: elasticsearch-es-http
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: elasticsearch-es-ca
    # cert SAN 중 하나와 일치해야 함 (SAN: elasticsearch-es-http.textmanager.svc 등)
    hostname: elasticsearch-es-http.textmanager.svc
