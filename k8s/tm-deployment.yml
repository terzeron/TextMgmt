---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tm-backend
  namespace: textmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tm-backend-app
  template:
    metadata:
      labels:
        app: tm-backend-app
    spec:
      initContainers:
        - name: wait-for-es
          image: busybox:1.37
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            [
              "sh",
              "-c",
              'until wget --spider http://elasticsearch-es-http:9200 2>&1 | grep -q "HTTP/"; do echo "waiting for elasticsearch..."; sleep 5; done',
            ]
      containers:
        - name: tm-backend
          image: registry.terzeron.com/terzeron/tm_backend:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8020
          env:
            - name: TM_BOOK_DIR
              value: /books
            - name: TM_COMICS_DIR
              value: /comics
            - name: TM_FRONTEND_URL
              value: https://tm.terzeron.com
            - name: TM_BACKEND_PORT
              value: "8020"
            - name: TM_ES_URL
              value: http://elasticsearch-es-http:9200
            - name: TM_ES_USER
              valueFrom: { secretKeyRef: { name: tm-es-cred, key: username } }
            - name: TM_ES_PASSWORD
              valueFrom: { secretKeyRef: { name: tm-es-cred, key: password } }
            - name: TM_ES_BOOK_INDEX
              value: book
            - name: TM_ES_COMICS_INDEX
              value: comics
            - name: TM_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tm-google-cred
                  key: client-id
            - name: TM_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tm-google-cred
                  key: client-secret
            - name: TM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tm-auth-cred
                  key: jwt-secret
            - name: TM_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: tm-auth-cred
                  key: admin-email
            - name: TM_ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: tm-auth-cred
                  key: allowed-emails
            - name: TM_MYSQL_HOST
              value: tm-mysql
            - name: TM_MYSQL_PORT
              value: "3306"
            - name: TM_MYSQL_DATABASE
              value: textmanager
            - name: TM_MYSQL_USER
              value: textmanager
            - name: TM_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tm-mysql-cred
                  key: mysql-password
          volumeMounts:
            - name: books-pvc
              mountPath: /books
            - name: comics-pvc
              mountPath: /comics
      volumes:
        - name: books-pvc
          persistentVolumeClaim:
            claimName: books-pvc
        - name: comics-pvc
          persistentVolumeClaim:
            claimName: comics-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tm-frontend
  namespace: textmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tm-frontend-app
  template:
    metadata:
      labels:
        app: tm-frontend-app
    spec:
      containers:
        - name: tm-frontend
          image: registry.terzeron.com/terzeron/tm_frontend:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: tm-backend
  namespace: textmanager
spec:
  selector:
    app: tm-backend-app
  ports:
    - protocol: TCP
      port: 8020
      targetPort: 8020
  type: NodePort

---
apiVersion: v1
kind: Service
metadata:
  name: tm-frontend
  namespace: textmanager
spec:
  selector:
    app: tm-frontend-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: NodePort
