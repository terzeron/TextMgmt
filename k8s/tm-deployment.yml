---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tm-backend
  namespace: textmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tm-backend-app
  template:
    metadata:
      labels:
        app: tm-backend-app
    spec:
      # syscall 표면 축소. 컨테이너별로 지정하지 않아도 pod 내 전체에 적용된다.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-es
          image: busybox:1.37
          # nc 한 줄만 실행하므로 비루트·읽기전용 rootfs로 충분하다.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            [
              "sh",
              "-c",
              'until nc -z elasticsearch-es-http 9200; do echo "waiting for elasticsearch..."; sleep 5; done',
            ]
      containers:
        - name: tm-backend
          image: registry.terzeron.com/terzeron/tm_backend:latest
          securityContext:
            runAsNonRoot: true
            # 이미지의 USER가 비숫자(terzeron)라 runAsNonRoot 검증을 위해 UID 명시 (Dockerfile USER_ID=1000)
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8020
          # resources 미지정 시 QoS BestEffort(oom_score_adj 1000) = 메모리 고갈 시 최우선 학살
          # 대상이었다 (2026-08-04 OOM storm). requests를 주어 Burstable(adj ~963)로 올린다.
          # 4Gi limit 근거: 10일 관측 peak 3185MiB. 512Mi 같은 값을 걸면 즉시 OOM kill 된다.
          # 주의: fresh start 169MiB → 4일 후 2194MiB로 증가하는 패턴(leak 의심)이 있어
          #       limit이 관측 peak을 감싸도록 크게 잡았다. leak 자체는 별도 조사 필요.
          # cpu 2 근거: 10일 관측 peak 917m + 여유 2배.
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2"
          env:
            - name: TM_BOOK_DIR
              value: /books
            - name: TM_COMICS_DIR
              value: /comics
            - name: TM_FRONTEND_URL
              value: https://tm.terzeron.com
            - name: TM_BACKEND_PORT
              value: "8020"
            - name: TM_ES_URL
              value: https://elasticsearch-es-http:9200
            - name: TM_ES_USER
              valueFrom: { secretKeyRef: { name: tm-es-cred, key: username } }
            - name: TM_ES_PASSWORD
              valueFrom: { secretKeyRef: { name: tm-es-cred, key: password } }
            - name: TM_ES_BOOK_INDEX
              value: book
            - name: TM_ES_COMICS_INDEX
              value: comics
            - name: TM_BACKFILL_CREATED_TIME_ON_STARTUP
              value: "true"
            - name: TM_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tm-google-cred
                  key: client-id
            - name: TM_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tm-google-cred
                  key: client-secret
            - name: TM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tm-auth-cred
                  key: jwt-secret
            - name: TM_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: tm-auth-cred
                  key: admin-email
            - name: TM_ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: tm-auth-cred
                  key: allowed-emails
            - name: TM_MYSQL_HOST
              value: tm-mysql
            - name: TM_MYSQL_PORT
              value: "3306"
            - name: TM_MYSQL_DATABASE
              value: textmanager
            - name: TM_MYSQL_USER
              value: textmanager
            - name: TM_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tm-mysql-cred
                  key: mysql-password
            # refresh token 저장소를 MySQL로 (replica/worker 간 공유, /tmp SQLite lock 회피)
            - name: TM_REFRESH_TOKEN_BACKEND
              value: mysql
            # rootfs 읽기전용이라 $HOME(/home/terzeron)이 RO. LibreOffice 프로필·fontconfig·
            # java 등 $HOME/XDG 기반 캐시·설정 쓰기를 writable emptyDir(/tmp)로 redirect.
            - name: HOME
              value: /tmp
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "test -d /books && [ $(ls -1A /books 2>/dev/null | wc -l) -gt 0 ] && test -d /comics && [ $(ls -1A /comics 2>/dev/null | wc -l) -gt 0 ]"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: books-pvc
              mountPath: /books
              mountPropagation: HostToContainer
            - name: comics-pvc
              mountPath: /comics
              mountPropagation: HostToContainer
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: books-pvc
          persistentVolumeClaim:
            claimName: books-pvc
        - name: comics-pvc
          persistentVolumeClaim:
            claimName: comics-pvc
        - name: tmp
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tm-frontend
  namespace: textmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tm-frontend-app
  template:
    metadata:
      labels:
        app: tm-frontend-app
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tm-frontend
          image: registry.terzeron.com/terzeron/tm_frontend:latest
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          # 정적 파일 서빙 nginx. 10일 관측 peak 23MiB / cpu <26m.
          # requests == limits로 QoS Guaranteed(oom_score_adj -997) — 비용이 작고
          # BestEffort(adj 1000) 학살 목록에서 빠지는 효과가 크다.
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # nginx-unprivileged: pid/temp 경로가 RO rootfs라 writable emptyDir 필요
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: tm-backend
  namespace: textmanager
spec:
  selector:
    app: tm-backend-app
  ports:
    - protocol: TCP
      port: 8020
      targetPort: 8020
  type: NodePort

---
apiVersion: v1
kind: Service
metadata:
  name: tm-frontend
  namespace: textmanager
spec:
  selector:
    app: tm-frontend-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: NodePort
