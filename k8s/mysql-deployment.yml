# 2026-10: MySQL 8.0.45 -> 8.4.13(LTS). 8.0은 2026-04 EOL이다.
# 제자리 업그레이드는 데이터 사전을 되돌릴 수 없게 바꾸므로 같은 PVC를 쓰지 않고, 새 PVC(mysql84-pvc)에
# 새 Deployment(tm-mysql-84)를 띄워 textmanager DB를 덤프/복원한 뒤 Service(tm-mysql)의 selector만 바꿨다.
# 이전 Deployment tm-mysql(replica 0)과 PVC mysql-pvc는 롤백용으로 클러스터에 남아 있다(이 파일에는 없다).
# 이 파일을 다시 apply해도 이전 인스턴스가 되살아나지 않는다.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql84-pvc
  namespace: textmanager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tm-mysql-84
  namespace: textmanager
spec:
  replicas: 1
  # 데이터 디렉터리를 쓰는 인스턴스는 항상 하나여야 한다. 기본 RollingUpdate 는
  # replicas 1 에서도 새 pod 를 먼저 띄우므로 두 mysqld 가 같은 RWO PVC 를 동시에
  # 열고, InnoDB 가 dblwr 잠금 경합을 일으킨다(2026-09-22 롤아웃에서 관측).
  # 동시접속이 낮은 서비스라 교체 중 잠깐의 중단보다 데이터 안전이 우선이다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tm-mysql-84-app
  template:
    metadata:
      labels:
        app: tm-mysql-84-app
    spec:
      # entrypoint가 root로 시작해야 하는 것과 무관하게 syscall 표면은 줄일 수 있다.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          # 8.4 는 롤링 태그라 조용히 올라간다. MySQL 은 기동 시
          # 데이터 디렉터리를 새 포맷으로 올리고 다운그레이드가 불가능하므로
          # 패치 버전까지 고정한다. 올릴 때는 이 값을 직접 바꾼다.
          image: mysql:8.4.13
          # mysql 공식 이미지(8.0, 8.4) entrypoint는 root로 시작해 chown 후 gosu로 mysql 유저로 강등하므로
          # runAsNonRoot 와 drop:[ALL] 은 기동을 깨뜨린다. 그 둘은 적용하지 않는다.
          # readOnlyRootFilesystem 은 쓰기가 필요한 두 경로(/tmp, /run/mysqld)를
          # emptyDir 로 내주면 정상 기동한다. mysql:8.0 로컬 기동으로 확인했고 8.4.13도 같은 설정으로 기동했다(2026-10-22):
          # 초기화 완료, CREATE/INSERT/SELECT 성공, 에러 로그 없음.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tm-mysql-cred
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: textmanager
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: tm-mysql-cred
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tm-mysql-cred
                  key: mysql-password
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: mysql-initdb
              mountPath: /docker-entrypoint-initdb.d
            # readOnlyRootFilesystem 아래에서 쓰기가 필요한 경로.
            # /var/run 은 /run 심볼릭 링크라 /run/mysqld 로 잡는다.
            - name: mysql-tmp
              mountPath: /tmp
            - name: mysql-run
              mountPath: /run/mysqld
          # QoS Guaranteed(oom_score_adj -997)를 위해 requests == limits.
          # 이전 256Mi/512Mi는 Burstable(adj 991)이라 호스트 메모리 고갈 시 초기 희생양이었고,
          # 10일 관측 peak 401MiB가 512Mi limit의 78%까지 차서 컨테이너 OOM 위험도 있었다.
          # 1Gi 근거: peak 401MiB + 여유 2.5배 / cpu 500m 근거: peak 120m + 여유 4배.
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql84-pvc
        - name: mysql-initdb
          configMap:
            name: mysql-initdb-config
        - name: mysql-tmp
          emptyDir: {}
        - name: mysql-run
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: tm-mysql
  namespace: textmanager
spec:
  selector:
    app: tm-mysql-84-app
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
      nodePort: 30306
  type: NodePort

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb-config
  namespace: textmanager
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS category_keywords (
        id INT AUTO_INCREMENT PRIMARY KEY,
        category VARCHAR(255) NOT NULL,
        keyword VARCHAR(255) NOT NULL,
        content_type VARCHAR(10) NOT NULL DEFAULT 'book',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE KEY unique_category_keyword (category, keyword, content_type),
        INDEX idx_category (category),
        INDEX idx_content_type (content_type)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS hidden_categories (
        id INT AUTO_INCREMENT PRIMARY KEY,
        category VARCHAR(255) NOT NULL,
        content_type VARCHAR(10) NOT NULL DEFAULT 'book',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE KEY unique_category_content_type (category, content_type),
        INDEX idx_category (category),
        INDEX idx_content_type (content_type)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS latest_excluded_categories (
        id INT AUTO_INCREMENT PRIMARY KEY,
        category VARCHAR(255) NOT NULL,
        content_type VARCHAR(10) NOT NULL DEFAULT 'book',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE KEY unique_latest_excluded_category_content_type (category, content_type),
        INDEX idx_category (category),
        INDEX idx_content_type (content_type)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS reload_locks (
        content_type VARCHAR(10) NOT NULL,
        lock_key VARCHAR(255) NOT NULL DEFAULT '__all__',
        category VARCHAR(255) NULL,
        reload_source VARCHAR(20) NOT NULL DEFAULT 'bulk',
        status VARCHAR(10) NOT NULL DEFAULT 'running',
        started_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        indexed_count INT NOT NULL DEFAULT 0,
        deleted_count INT NOT NULL DEFAULT 0,
        failed_count INT NOT NULL DEFAULT 0,
        before_count INT NOT NULL DEFAULT 0,
        after_count INT NOT NULL DEFAULT 0,
        error TEXT NULL,
        PRIMARY KEY (content_type, lock_key)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
