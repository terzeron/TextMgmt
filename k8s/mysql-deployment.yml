---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: textmanager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tm-mysql
  namespace: textmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tm-mysql-app
  template:
    metadata:
      labels:
        app: tm-mysql-app
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          # mysql:8.0 entrypoint는 root로 시작해 chown 후 gosu로 mysql 유저로 강등하므로
          # runAsNonRoot / drop:[ALL] / readOnlyRootFilesystem는 기동을 깨뜨린다.
          # no_new_privs(권한 상승 차단)만 추가로 안전하게 적용한다.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tm-mysql-cred
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: textmanager
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: tm-mysql-cred
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tm-mysql-cred
                  key: mysql-password
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: mysql-initdb
              mountPath: /docker-entrypoint-initdb.d
          # QoS Guaranteed(oom_score_adj -997)를 위해 requests == limits.
          # 이전 256Mi/512Mi는 Burstable(adj 991)이라 호스트 메모리 고갈 시 초기 희생양이었고,
          # 10일 관측 peak 401MiB가 512Mi limit의 78%까지 차서 컨테이너 OOM 위험도 있었다.
          # 1Gi 근거: peak 401MiB + 여유 2.5배 / cpu 500m 근거: peak 120m + 여유 4배.
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-initdb
          configMap:
            name: mysql-initdb-config

---
apiVersion: v1
kind: Service
metadata:
  name: tm-mysql
  namespace: textmanager
spec:
  selector:
    app: tm-mysql-app
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
      nodePort: 30306
  type: NodePort

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb-config
  namespace: textmanager
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS category_keywords (
        id INT AUTO_INCREMENT PRIMARY KEY,
        category VARCHAR(255) NOT NULL,
        keyword VARCHAR(255) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE KEY unique_category_keyword (category, keyword),
        INDEX idx_category (category)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
