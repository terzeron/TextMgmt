---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: comics-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /mnt/data/만화

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comics-pvc
  namespace: textmanager
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  volumeName: comics-pv
  storageClassName: ""
