# 보안 응답 헤더 (server 블록과, 자체 add_header 를 가진 location 양쪽에서 include).
# nginx 는 하위 컨텍스트에 add_header 가 하나라도 있으면 상위의 add_header 를
# 상속하지 않으므로, Cache-Control 을 정의한 location / 와 location /assets/ 에도
# 이 파일을 include 해야 보안 헤더가 메인 문서·에셋 응답에 적용된다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://api-tm.terzeron.com https://accounts.google.com; frame-src https://accounts.google.com; worker-src 'self' blob: https://unpkg.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https://accounts.google.com" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
