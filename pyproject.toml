[tool.black]
line-length = 120
target-version = ["py39"]

[tool.isort]
py_version = 39
skip = ["__init__.py"]
skip_glob = ["migrations/*"]
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = false
#follow_imports = skip
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
#warn_return_any = true

[tool.poetry.dev-dependencies]
pylint = "3.1.0"
mypy = "1.10.0"

[tool.pylint."master"]
ignore = [".github/*", "idea/*", ".mypy_cache/*", ".run/*", "frontend/*", "out/*"]
disable = ["line-too-long", "missing-module-docstring", "missing-function-docstring", "missing-class-docstring", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-few-public-methods", "logging-fstring-interpolation", "invalid-name", "protected-access", "unexpected-keyw