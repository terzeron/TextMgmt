[project]
name = "tm-dev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = [
    "beautifulsoup4==4.12.3",
    "chardet==5.2.0",
    "ebooklib==0.19",
    "elastic-transport==8.17.1",
    "elasticsearch==8.15.1",
    "fastapi==0.116.1",
    "google-auth>=2.41.1",
    "httpx==0.27.0",
    "lxml>=5.4",
    "pydantic==2.11.7",
    "pymysql[rsa]>=1.1.2",
    "pikepdf>=10.0",
    "pypdf==4.3.1",
    "python-docx==1.1.2",
    "requests==2.32.4",
    "striprtf==0.0.29",
    "uvicorn==0.30.1",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.22",
]

[dependency-groups]
dev = [
    # 직접 import
    "konlpy==0.6.0",
    "modulegraph==0.19.6",
    "pytest==7.0.1",
    "pytest-asyncio==0.23.6",
    "testcontainers>=4.14.1",
    # pytest 플러그인
    "pytest-json-report==1.5.0",
    # CLI 도구
    "isort==5.13.2",
    "mypy==1.10.0",
    "pylint==3.1.0",
    "pyright==1.1.361",
    # type stubs
    "types-python-dateutil==2.9.0.20240316",
    "types-pytz==2024.1.0.20240417",
    "pytest-cov>=7.1.0",
]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.isort]
py_version = 39
skip = ["__init__.py"]
skip_glob = ["migrations/*"]
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = false
#follow_imports = skip
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
#warn_return_any = true

[tool.poetry.dev-dependencies]
pylint = "3.1.0"
mypy = "1.10.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning",
    "ignore::DeprecationWarning:testcontainers.*",
    "ignore::DeprecationWarning:_pytest.assertion.rewrite",
    "ignore::bs4.XMLParsedAsHTMLWarning",
    "ignore::RuntimeWarning:unittest.case",
]

[tool.pylint."master"]
ignore = [".github/*", "idea/*", ".mypy_cache/*", ".run/*", "frontend/*", "out/*"]
disable = ["line-too-long", "missing-module-docstring", "missing-function-docstring", "missing-class-docstring", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-many-lines", "too-many-return-statements", "too-many-boolean-expressions", "too-many-nested-blocks", "too-many-ancestors", "too-many-arguments", "too-many-locals", "too-many-instance-attributes", "too-many-branches", "too-many-statements", "too-many-public-methods", "too-few-public-methods", "logging-fstring-interpolation", "invalid-name", "protected-access", "unexpected-keyword-arg"]

[tool.ruff]
line-length = 320

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true
