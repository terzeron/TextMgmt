name: backend-ci

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'libs/**'
      - 'utils/**'
      - 'tests/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'libs/**'
      - 'utils/**'
      - 'tests/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/backend-ci.yml'
  # Cargo.lock이 그대로여도 새 RustSec 공지는 나온다. 매주 cargo-audit만 다시 돌린다.
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@dd87c1884d4b74c592b9ad3151acd86a8a80c6f2 # 1.91.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # MuPDF(pdf_engine)를 빌드하는 시스템 라이브러리. 목록은 backend/Dockerfile 빌드 단계와 docs/pdf-engine.md를 따른다.
      - name: Install native build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config cmake libclang-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libjpeg-turbo8-dev libopenjp2-7-dev zlib1g-dev fonts-noto-cjk
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: cargo clippy -p backend -p loader --all-targets --locked -- -D warnings

  # RustSec 공지에 등록된 취약점이 Cargo.lock에 있으면 실패한다. unmaintained 경고는 실패로 치지 않는다.
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit

  container-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --file backend/Dockerfile --tag textmgmt-backend:ci .
