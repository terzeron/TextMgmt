# 프론트엔드 의존성 게이트.
# Dependabot 이 단일 패키지만 올려 peer 를 깨뜨린 락파일이 develop 에 들어가면
# ./build.sh 의 `npm ci` 단계에서야 드러난다(2026-09, PR #168: @vitest/coverage-v8
# 만 5.0.0 으로 올라가 vitest ^4.1.10 과 peer 충돌). 머지 전에 같은 명령을 돌려 막는다.
name: frontend-ci

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      # node-version-file 로 frontend/.nvmrc 를 따른다. Dockerfile 의 FROM node:22.23.2
      # 와 같은 값을 한 곳에서 관리하기 위함이다.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 이미지 빌드와 같은 명령. 락파일과 package.json 이 어긋나거나 peer 가 충돌하면
      # 여기서 실패한다.
      - run: npm ci

      # lint 는 아직 게이트에 넣지 않는다. HEAD 기준으로 tests/ 에 미사용 변수와
      # prop-types 오류 6건이 남아 있어, 지금 넣으면 모든 PR 이 즉시 막힌다.
      # 해당 오류를 정리한 뒤 `- run: npm run lint` 를 여기에 추가한다.

      - run: npm test

      # 락파일이 실제로 재현 가능한지 확인한다. npm ci 가 통과해도 vite 빌드가
      # 깨지는 경우를 잡는다.
      - run: npm run build
