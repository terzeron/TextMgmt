version: 2
updates:
  # workflow의 Action은 commit SHA로 고정한다. 이 항목이 없으면 고정한 SHA가 갱신되지 않는다.
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    target-branch: "develop"
    rebase-strategy: "auto"

  - package-ecosystem: "npm"
    directory: "/frontend"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    target-branch: "develop"
    rebase-strategy: "auto"
    # caniuse-lite 는 데이터 갱신용으로 devDependencies 에 직접 선언해 둔 것이라
    # 매니페스트 범위를 매번 올릴 이유가 없다. 범위가 이미 새 버전을 허용하면
    # package.json 은 그대로 두고 package-lock.json 의 resolved 버전만 갱신한다.
    versioning-strategy: "increase-if-necessary"
