version: 2
updates:
  # workflow의 Action은 commit SHA로 고정한다. 이 항목이 없으면 고정한 SHA가 갱신되지 않는다.
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    target-branch: "develop"
    rebase-strategy: "auto"

  - package-ecosystem: "npm"
    directory: "/frontend"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    target-branch: "develop"
    rebase-strategy: "auto"
    # caniuse-lite 는 데이터 갱신용으로 devDependencies 에 직접 선언해 둔 것이라
    # 매니페스트 범위를 매번 올릴 이유가 없다. 범위가 이미 새 버전을 허용하면
    # package.json 은 그대로 두고 package-lock.json 의 resolved 버전만 갱신한다.
    versioning-strategy: "increase-if-necessary"

  # 루트 Cargo.toml이 workspace라 "/" 하나로 모든 crate를 덮는다.
  # crate마다 PR이 따로 오지 않게 minor·patch는 한 PR로 묶는다. major는 따로 온다.
  - package-ecosystem: "cargo"
    directory: "/"
    # url 같은 전이 의존성도 보안 경보를 기다리지 않고 일반 갱신 대상에 포함한다.
    allow:
      - dependency-type: "all"
    cooldown:
      default-days: 7
      # patch는 대기 기간을 줄인다. 실제 갱신은 아래 주간 일정에 따른다.
      semver-patch-days: 1
    schedule:
      interval: "weekly"
    target-branch: "develop"
    rebase-strategy: "auto"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
