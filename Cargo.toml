[workspace]
resolver = "3"
members = ["libs/common", "libs/http_client", "libs/es_client", "libs/container_parser", "libs/doc_checker", "libs/doc_repairer", "utils/bookdoctor", "libs/parse_stat_counter", "libs/file_indexer", "libs/htmlkit", "libs/isbn_extractor", "libs/hwp3_parser", "libs/text_decoder", "libs/xml_recoverer", "libs/search_manager", "libs/auth_manager", "libs/image_processor", "libs/cover_manager", "libs/book_model", "libs/book_manager", "libs/bookstore", "libs/doc_reader", "utils/loader", "utils/search", "libs/pdf_engine", "libs/sysdeps", "libs/db", "libs/classifier", "utils/classifier_trainer", "backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# 공유 의존성은 여기서 버전을 한 번만 정한다. 각 crate는 `dep.workspace = true`로 쓴다.
[workspace.dependencies]
# 날짜 API를 쓰지 않으므로 기본 feature의 chrono를 뺀다. rayon은 기본값 그대로 둔다.
lopdf = { version = "0.47", default-features = false, features = ["rayon"] }
log = "0.4"
# chrono 관리 중단(RUSTSEC-2026-0543)으로 날짜·시각은 jiff를 쓴다.
jiff = "1.0.1"
serde_json = "1"
# 내부망 http 전용이라 TLS 기능을 켜지 않는다.
ureq = { version = "3.5", default-features = false, features = ["json"] }

[patch.crates-io]

# 테스트 바이너리의 80%가 debug info였다(413M 중 328M). 백트레이스용 줄 정보만 남긴다.
[profile.dev]
debug = "line-tables-only"

# 개발·테스트 빌드에서 이미지 디코딩이 너무 느리다 (6000x8000 JPEG 테스트가 100초). 디코더 crate만 최적화한다.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
# RTF 파서는 토큰마다 정규식을 돌린다. 최적화하지 않으면 19MB 코퍼스 테스트가 28초다(최적화 시 7초).
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
# EPUB 본문은 HTML 파서로 읽는다. 최적화하지 않으면 코퍼스 EPUB 테스트가 6.6초다(최적화 시 1.9초).
[profile.dev.package.scraper]
opt-level = 3
[profile.dev.package.html5ever]
opt-level = 3
[profile.dev.package.markup5ever]
opt-level = 3
[profile.dev.package.tendril]
opt-level = 3
[profile.dev.package.backend]
opt-level = 1

# 개발 배포·리얼 배포·CI Docker 빌드가 모두 쓴다. QA한 실행 파일이 그대로 운영에 나간다.
# 증분 빌드 시간을 줄이려고 crate 사이 LTO를 끄고(crate 안 thin LTO만 남는다)
# codegen-units를 8로 나누고 증분 컴파일을 켠다. thin LTO + codegen-units 1일 때 backend 한 줄
# 수정이 약 55~75초였다(그중 LTO 약 27초).
[profile.release]
opt-level = 3
lto = false
codegen-units = 8
incremental = true
panic = "unwind" # bookdoctor가 catch_unwind로 파서 panic을 격리한다
strip = true
