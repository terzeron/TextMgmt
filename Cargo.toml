[workspace]
resolver = "3"
members = ["utils/pdfscan", "libs/corpus_layout", "libs/es_client", "utils/detect_mojibake", "utils/quarantine_broken", "utils/cluster_hybrid_genres", "utils/search", "utils/epubscan", "libs/stat", "libs/file_time", "libs/parser_timeout", "libs/htmlkit", "libs/isbn", "libs/hwp3_tables", "libs/hwp3_parser", "libs/pyfmt", "libs/corpus_common", "utils/update", "utils/move_semi_clusters", "utils/classify_books_client", "utils/reload_samgukji_epubs", "utils/normalize_comic_directories", "libs/bookstore"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# 공유 의존성은 여기서 버전을 한 번만 정한다. 각 crate는 `dep.workspace = true`로 쓴다.
[workspace.dependencies]
lopdf = "0.46"
serde_json = "1"
# 내부망 http 전용이라 TLS 기능을 켜지 않는다.
ureq = { version = "3.5", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind" # pdfscan이 catch_unwind로 파서 panic을 격리한다
strip = true
