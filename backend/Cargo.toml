[package]
name = "backend"
description = "TextMgmt 백엔드 API (backend/*.py의 Rust 대응). axum + diesel + libs/es_client"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/bin/backend.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.23.1"
axum = "0.8.9"
bookstore_lib = { package = "bookstore", path = "../libs/bookstore" }
corpus_layout = { path = "../libs/corpus_layout" }
diesel = { version = "2.3.14", default-features = false, features = ["mysql", "r2d2", "chrono"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
htmlkit = { path = "../libs/htmlkit" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
log = "0.4.34"
lopdf.workspace = true
# MySQL 클라이언트는 개발 헤더 없이 쓰려고 소스에서 번들 빌드한다 (docs/rust-test-seams.md, diesel spike)
mysqlclient-sys = { version = "0.5.2", features = ["bundled"] }
regex = "1.13.1"
roxmltree = "0.21.1"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.11.1"
sysdeps = { path = "../libs/sysdeps" }
ureq.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[[test]]
name = "db"
path = "../tests/rust/backend/db.rs"

[[test]]
name = "common_smoke"
path = "../tests/rust/backend/common_smoke.rs"

[[test]]
name = "refresh_token_store"
path = "../tests/rust/backend/refresh_token_store.rs"

