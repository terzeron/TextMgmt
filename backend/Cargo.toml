[package]
name = "backend"
description = "TextMgmt 백엔드 API. axum 라우터와 실행 진입점. 도메인 로직은 libs/의 *_manager crate를 쓴다"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/bin/backend.rs"

[dependencies]
auth_manager = { path = "../libs/auth_manager" }
book_manager = { path = "../libs/book_manager" }
classifier = { path = "../libs/classifier" }
common = { path = "../libs/common" }
cover_manager = { path = "../libs/cover_manager" }
search_manager = { path = "../libs/search_manager" }
fancy-regex = "0.14.0"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["multipart"] }
bookstore = { path = "../libs/bookstore" }
db = { path = "../libs/db" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
log = "0.4.34"
md5 = { package = "md-5", version = "0.11.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sysdeps = { path = "../libs/sysdeps" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }

[dev-dependencies]
file_indexer = { path = "../libs/file_indexer" }
# 테스트가 구형·만료 refresh token을 직접 만들어 거절되는지 확인한다.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
doc_reader = { path = "../libs/doc_reader" }
image_processor = { path = "../libs/image_processor" }
pdf_engine = { path = "../libs/pdf_engine" }
lopdf.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
roxmltree = "0.21.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
jpeg-encoder = "0.7.1"
es_client = { path = "../libs/es_client" }
parse_stat_counter = { path = "../libs/parse_stat_counter" }
base64 = "0.23.1"
flate2 = "1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
sha2 = "0.11.1"
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["mysql", "blocking"] }
tower = { version = "0.5.3", features = ["util"] }

[[test]]
name = "api_router"
path = "../tests/rust/backend/api_router.rs"

[[test]]
name = "stderr_logger"
path = "../tests/rust/backend/stderr_logger.rs"

