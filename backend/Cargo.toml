[package]
name = "backend"
description = "TextMgmt 백엔드 API (backend/*.py의 Rust 대응). axum + diesel + libs/es_client"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/bin/backend.rs"

[[bin]]
name = "epubveri"
path = "src/bin/epubveri.rs"

[dependencies]
epubveri = "0.33.0"
es_client = { path = "../libs/es_client" }
file_record = { path = "../libs/file_record" }
fancy-regex = "0.14.0"
pyfmt = { path = "../libs/pyfmt" }
async-trait = "0.1"
base64 = "0.23.1"
axum = { version = "0.8.9", features = ["multipart"] }
bookstore = { path = "../libs/bookstore" }
classifier = { path = "../libs/classifier" }
db = { path = "../libs/db" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
htmlkit = { path = "../libs/htmlkit" }
hwp3_parser = { path = "../libs/hwp3_parser" }
idna = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
log = "0.4.34"
md5 = { package = "md-5", version = "0.11.0" }
lopdf.workspace = true
regex = "1.13.1"
roxmltree = "0.21.1"
scraper = "0.29.0"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sysdeps = { path = "../libs/sysdeps" }
text_extractor = { path = "../libs/text_extractor" }
ureq = { workspace = true, features = ["rustls"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
jpeg-encoder = "0.7.1"

[dev-dependencies]
doc_reader = { path = "../libs/doc_reader" }
stat = { path = "../libs/stat" }
base64 = "0.23.1"
flate2 = "1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
sha2 = "0.11.1"
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["mysql", "blocking"] }
tower = { version = "0.5.3", features = ["util"] }

