[package]
name = "backend"
description = "TextMgmt 백엔드 API (backend/*.py의 Rust 대응). axum + diesel + libs/es_client"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "src/lib.rs"

[[test]]
name = "pdf_edit"
path = "../tests/rust/backend/pdf_edit.rs"

[[test]]
name = "pdf_delete_pages"
path = "../tests/rust/backend/pdf_delete_pages.rs"

[[test]]
name = "pdf_delete_pages_gaps"
path = "../tests/rust/backend/pdf_delete_pages_gaps.rs"

[[test]]
name = "main_bulk_rename"
path = "../tests/rust/backend/main_bulk_rename.rs"

[[test]]
name = "main_gaps"
path = "../tests/rust/backend/main_gaps.rs"

[[test]]
name = "api_exploration"
path = "../tests/rust/backend/api_exploration.rs"

[[test]]
name = "classifier_training"
path = "../tests/rust/backend/classifier_training.rs"

[[test]]
name = "pdf_pages"
path = "../tests/rust/backend/pdf_pages.rs"

[[test]]
name = "book_preview"
path = "../tests/rust/backend/book_preview.rs"

[[test]]
name = "cover"
path = "../tests/rust/backend/cover.rs"

[[bin]]
name = "backend"
path = "src/bin/backend.rs"

[dependencies]
doc_reader = { path = "../libs/doc_reader" }
es_client = { path = "../libs/es_client" }
loader = { path = "../utils/loader" }
fancy-regex = "0.14.0"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
pyferrite = "0.0.2"
pyfmt = { path = "../libs/pyfmt" }
async-trait = "0.1"
base64 = "0.23.1"
axum = { version = "0.8.9", features = ["multipart"] }
bookstore_lib = { package = "bookstore", path = "../libs/bookstore" }
corpus_common = { path = "../libs/corpus_common" }
corpus_layout = { path = "../libs/corpus_layout" }
diesel = { version = "2.3.14", default-features = false, features = ["mysql", "r2d2", "chrono"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
htmlkit = { path = "../libs/htmlkit" }
hwp3_parser = { path = "../libs/hwp3_parser" }
idna = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif"] }
isbn = { path = "../libs/isbn" }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
log = "0.4.34"
md5 = { package = "md-5", version = "0.11.0" }
lopdf.workspace = true
# MySQL 클라이언트는 개발 헤더 없이 쓰려고 소스에서 번들 빌드한다 (docs/rust-test-seams.md, diesel spike)
mysqlclient-sys = { version = "0.5.2", features = ["bundled"] }
regex = "1.13.1"
roxmltree = "0.21.1"
scraper = "0.29.0"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
stat = { path = "../libs/stat" }
sysdeps = { path = "../libs/sysdeps" }
ureq = { workspace = true, features = ["rustls"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
jpeg-encoder = "0.7.1"
