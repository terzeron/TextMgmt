[package]
name = "loader"
description = "파일을 읽어 Elasticsearch 색인에 적재한다 (utils/loader.py의 Rust 대응)"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

# loader_1, loader_2는 doc_reader/loader에 *_with(&XxxHooks) API를 만든 뒤 등록한다.
[[test]]
name = "loader_gaps"
path = "../../tests/rust/loader/loader_gaps.rs"

[[test]]
name = "loader_hwp3"
path = "../../tests/rust/loader/loader_hwp3.rs"

[[test]]
name = "loader_1"
path = "../../tests/rust/loader/loader_1.rs"

[[test]]
name = "loader_2"
path = "../../tests/rust/loader/loader_2.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
corpus_common = { path = "../../libs/corpus_common" }
corpus_layout = { path = "../../libs/corpus_layout" }
doc_reader = { path = "../../libs/doc_reader" }
es_client = { path = "../../libs/es_client" }
file_time = { path = "../../libs/file_time" }
isbn = { path = "../../libs/isbn" }
lopdf.workspace = true
parser_timeout = { path = "../../libs/parser_timeout" }
serde_json = { workspace = true, features = ["preserve_order"] }
stat = { path = "../../libs/stat" }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
encoding_rs = "0.8.35"
hwp3_parser = { path = "../../libs/hwp3_parser" }
hwp3_tables = { path = "../../libs/hwp3_tables" }
tempfile = "3.27.0"
