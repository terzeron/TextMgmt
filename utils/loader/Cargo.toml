[package]
name = "loader"
description = "파일을 읽어 Elasticsearch 색인에 적재한다"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

# binary_and_file_reading, pdf_and_text_stages는 doc_reader/loader에 *_with(&XxxHooks) API를 만든 뒤 등록한다.

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
es_client = { path = "../../libs/es_client" }
file_indexer = { path = "../../libs/file_indexer" }
serde_json = { workspace = true, features = ["preserve_order"] }
stat = { path = "../../libs/stat" }

[dev-dependencies]
# 테스트는 PDF 단계·파서를 직접 다룬다. 소스는 file_indexer를 거친다.
doc_reader = { path = "../../libs/doc_reader" }
encoding_rs = "0.8.35"
hwp3_parser = { path = "../../libs/hwp3_parser" }
isbn = { path = "../../libs/isbn" }
sysdeps = { path = "../../libs/sysdeps" }
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[[test]]
name = "cli_parser"
path = "../../tests/rust/loader/cli_parser.rs"

[[test]]
name = "batch_loader"
path = "../../tests/rust/loader/batch_loader.rs"

[[test]]
name = "integration_binary_and_file_reading"
path = "../../tests/rust/loader/integration/binary_and_file_reading.rs"

[[test]]
name = "integration_pdf_and_text_stages"
path = "../../tests/rust/loader/integration/pdf_and_text_stages.rs"

[[test]]
name = "integration_reload_failures"
path = "../../tests/rust/loader/integration/reload_failures.rs"

[[test]]
name = "integration_loader_hwp3"
path = "../../tests/rust/loader/integration/loader_hwp3.rs"
