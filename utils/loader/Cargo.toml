[package]
name = "loader"
description = "파일을 읽어 Elasticsearch 색인에 적재한다 (utils/loader.py의 Rust 대응)"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

# loader_1, loader_2는 doc_reader/loader에 *_with(&XxxHooks) API를 만든 뒤 등록한다.

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
doc_reader = { path = "../../libs/doc_reader" }
es_client = { path = "../../libs/es_client" }
file_record = { path = "../../libs/file_record" }
serde_json = { workspace = true, features = ["preserve_order"] }
stat = { path = "../../libs/stat" }

[dev-dependencies]
encoding_rs = "0.8.35"
hwp3_parser = { path = "../../libs/hwp3_parser" }
isbn = { path = "../../libs/isbn" }
sysdeps = { path = "../../libs/sysdeps" }
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[[test]]
name = "cli"
path = "../../tests/rust/loader/cli.rs"

[[test]]
name = "flow"
path = "../../tests/rust/loader/flow.rs"

[[test]]
name = "integration_loader_1"
path = "../../tests/rust/loader/integration/loader_1.rs"

[[test]]
name = "integration_loader_2"
path = "../../tests/rust/loader/integration/loader_2.rs"

[[test]]
name = "integration_loader_gaps"
path = "../../tests/rust/loader/integration/loader_gaps.rs"

[[test]]
name = "integration_loader_hwp3"
path = "../../tests/rust/loader/integration/loader_hwp3.rs"
