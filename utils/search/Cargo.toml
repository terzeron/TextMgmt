[package]
name = "search"
description = "ES 제목·내용 검색 점검 도구 (utils/search.py의 Rust 대응)"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
es_client = { path = "../../libs/es_client" }
serde_json = { workspace = true, features = ["preserve_order"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[[test]]
name = "search"
path = "../../tests/rust/search/search.rs"

[[test]]
name = "integration_bin"
path = "../../tests/rust/search/integration/bin.rs"
