[package]
name = "bookdoctor"
description = "EPUB·PDF·TXT 통합 진단 도구: 명령행, 파일 순회·병렬 실행, 정리·수리 적용, 보고 출력. 검사 기법은 doc_checker, 교정 기법은 doc_repairer"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
common = { path = "../../libs/common", default-features = false }
doc_checker = { path = "../../libs/doc_checker" }
doc_repairer = { path = "../../libs/doc_repairer" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
# 테스트 준비물(doc_checker 테스트와 함께 쓴다)이 ZIP·PDF·압축 데이터를 만든다.
encoding_rs = "0.8.42"
flate2 = "1"
lopdf.workspace = true
sysdeps = { path = "../../libs/sysdeps" }
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

