[package]
name = "bookdoctor"
description = "EPUB·PDF·TXT 통합 진단 (보안, 결함, 렌더링 차단 검사)"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
common = { path = "../../libs/common", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
text_decoder = { path = "../../libs/text_decoder" }
encoding_rs = "0.8.42"
flate2 = "1"
htmlkit = { path = "../../libs/htmlkit" }
lopdf.workspace = true
rayon = "1.12.0"
regex = "1.13.1"
roxmltree = "0.21.1"
scraper = "0.29.0"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sysdeps = { path = "../../libs/sysdeps" }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

