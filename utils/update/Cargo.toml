[package]
name = "update"
description = "ES 색인 갱신·조회·삭제 점검 (utils/update.py의 Rust 대응)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
