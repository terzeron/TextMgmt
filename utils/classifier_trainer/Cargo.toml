[package]
name = "classifier_trainer"
description = "ES 문서에서 카테고리별 균등 무작위 표본을 뽑아 도서 분류 모델을 학습한다"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
classifier = { path = "../../libs/classifier" }
search_manager = { path = "../../libs/search_manager" }
rand = "0.9"
rand_chacha = "0.9"
serde_json = { workspace = true }

[[test]]
name = "sample_drawer"
path = "../../tests/rust/classifier_trainer/sample_drawer.rs"

[[test]]
name = "model_trainer"
path = "../../tests/rust/classifier_trainer/model_trainer.rs"

[[test]]
name = "holdout_evaluator"
path = "../../tests/rust/classifier_trainer/holdout_evaluator.rs"

[[test]]
name = "integration_trainer_cli"
path = "../../tests/rust/classifier_trainer/integration/trainer_cli.rs"
