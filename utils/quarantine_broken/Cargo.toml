[package]
name = "quarantine_broken"
description = "인코딩이 손상된 문서를 0_broken으로 격리하고 되돌린다 (utils/quarantine_broken.py의 Rust 대응)"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "bin"
path = "../../tests/rust/quarantine_broken/bin.rs"

[[test]]
name = "quarantine"
path = "../../tests/rust/quarantine_broken/quarantine.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
corpus_common = { path = "../../libs/corpus_common" }
scan_common = { path = "../../libs/scan_common" }
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27.0"
