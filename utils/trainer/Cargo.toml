[package]
name = "trainer"
description = "도서 분류 모델 관리: Rust 학습·추론"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
bookstore = { path = "../../libs/bookstore" }
classifier = { path = "../../libs/classifier" }
db = { path = "../../libs/db" }
es_client = { path = "../../libs/es_client" }
log.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "commands"
path = "../../tests/rust/trainer/commands.rs"

[[test]]
name = "data"
path = "../../tests/rust/trainer/data.rs"

[[test]]
name = "trainer"
path = "../../tests/rust/trainer/trainer.rs"

[[test]]
name = "integration_cli"
path = "../../tests/rust/trainer/integration/cli.rs"
