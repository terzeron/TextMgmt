[package]
name = "trainer"
description = "도서 분류 모델 관리: Rust 학습·추론"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
classifier = { path = "../../libs/classifier" }
db = { path = "../../libs/db" }
es_client = { path = "../../libs/es_client" }
log.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "command_runner"
path = "../../tests/rust/trainer/command_runner.rs"

[[test]]
name = "data_loader"
path = "../../tests/rust/trainer/data_loader.rs"

[[test]]
name = "trainer"
path = "../../tests/rust/trainer/trainer.rs"

[[test]]
name = "integration_cli"
path = "../../tests/rust/trainer/integration/cli.rs"
