[package]
name = "detect_mojibake"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "bin"
path = "../../tests/rust/detect_mojibake/bin.rs"

[[test]]
name = "detect"
path = "../../tests/rust/detect_mojibake/detect.rs"

[dependencies]
corpus_common = { path = "../../libs/corpus_common" }
pyfmt = { path = "../../libs/pyfmt" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8.42"
indexmap = { version = "2.14.2", features = ["serde"] }
rayon = "1.12.0"
regex = "1.13.1"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
